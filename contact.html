<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact</title>
        <style>
            body {
                margin: 0;
                font-family: "Segoe UI", Arial, sans-serif;
                background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
                color: #e2e8f0;
                text-align: center;
                min-height: 100vh;
            }

            center {
                display: block;
                max-width: 760px;
                margin: 40px auto 20px;
                padding: 30px 24px;
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 14px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            }

            img {
                border-radius: 50%;
                border: 5px solid #f59e0b;
                object-fit: cover;
                box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
            }

            h2 {
                color: #fbbf24;
                margin: 16px 0 0;
                letter-spacing: 2px;
            }

            form {
                max-width: 560px;
                margin: 0 auto;
                padding: 24px;
                background: #1e293b;
                border: 1px solid #334155;
                border-left: 4px solid #f59e0b;
                border-radius: 14px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
                text-align: left;
            }

            form > strong {
                display: block;
                margin-bottom: 14px;
                text-align: center;
                color: #fbbf24;
                font-size: 20px;
                letter-spacing: 1px;
            }

            fieldset {
                border: 0;
                margin: 0;
                padding: 0;
            }

            label {
                display: block;
                margin: 14px 0 6px;
                color: #cbd5e1;
                font-weight: 600;
                font-size: 14px;
            }

            input, select {
                width: 100%;
                box-sizing: border-box;
                padding: 10px 12px;
                background: #0f172a;
                color: #f8fafc;
                border: 1px solid #334155;
                border-radius: 6px;
                font-size: 15px;
            }

            input:focus, select:focus {
                outline: none;
                border-color: #f59e0b;
                box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
            }

            br {
                display: none;
            }

            button {
                display: block;
                width: 100%;
                margin-top: 22px;
                padding: 12px;
                background: #f59e0b;
                color: #0f172a;
                border: 0;
                border-radius: 6px;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
            }

            button:hover {
                background: #fbbf24;
            }

            footer {
                margin-top: 30px;
                padding: 12px 0 24px;
                color: #94a3b8;
                font-size: 14px;
            }

            hr {
                width: 60%;
                border: 0;
                height: 2px;
                background: #f59e0b;
            }
        </style>
    </head>

    <body>
        <h1>WAGAYAN'S MIDTERM PORTFOLIO</h1>
        <a href="index.html">Home |</a>
        <a href="about.html">About|</a>
        <a href="services.html">Services|</a>
        <a href="media.html">Media|</a>
        <a href="contact.html">Contact|</a>
        
        <center>
            <img src="prof.png" alt="Kurt Wagayan" width="400" height="400">
            <h2> Contact Details </h2>
        </center>

        <form>
            <strong>Contact Form</strong>
            <fieldset id="contact">
                <label for="name">Enter Fullname *</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required>
                <br>
                <label for="email">Enter Email *</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                <br>
                <label for="Inquiry">Select Inquiry Topic</label>
                <select id="Inquiry" name="inquiry">
                    <option value="op1">Option 1</option>
                    <option value="op2">Option 2</option>
                    <option value="op3">Option 3</option>
                </select>
                <br>
                <label for="message">Message *</label>
                <input type="text" id="message" name="message" placeholder="How can I help you?" required>
                <br>

                <button type="submit">Send Message</button>
            </fieldset>
        </form>

        <footer>
            <hr>
            <p>&copy; Developed by Kurt Wagayan | HUMAN-COMPUTER INTERACTION </p>
        </footer>
    </body>
</html>
